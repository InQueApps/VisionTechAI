name: Android Sphere E2E

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/cpp/sphere_jni.cpp'
      - 'app/src/main/cpp/CMakeLists.txt'
      - 'app/src/main/java/**/Sphere*.kt'
      - 'app/src/main/java/**/LensDistortion*.kt'
      - 'app/src/main/java/**/ImuCameraClockSync.kt'
      - 'app/src/main/java/**/OrientationTracker.kt'
      - 'app/src/main/java/**/OrientationQuaternionHistory.kt'
      - 'app/src/main/java/**/PipelineResultDispatcher.kt'
      - 'app/src/main/java/**/MainActivity.kt'
      - 'app/src/main/java/**/VisionAnalysisPipeline.kt'
      - 'app/src/androidTest/**/Sphere*.kt'
      - 'app/src/androidTest/**/MainActivity*.kt'
      - 'app/src/androidTest/**/VisionWorkflow*.kt'
  pull_request:
    paths:
      - 'app/src/main/cpp/sphere_jni.cpp'
      - 'app/src/main/cpp/CMakeLists.txt'
      - 'app/src/main/java/**/Sphere*.kt'
      - 'app/src/main/java/**/LensDistortion*.kt'
      - 'app/src/main/java/**/ImuCameraClockSync.kt'
      - 'app/src/main/java/**/OrientationTracker.kt'
      - 'app/src/main/java/**/OrientationQuaternionHistory.kt'
      - 'app/src/main/java/**/PipelineResultDispatcher.kt'
      - 'app/src/main/java/**/MainActivity.kt'
      - 'app/src/main/java/**/VisionAnalysisPipeline.kt'
      - 'app/src/androidTest/**/Sphere*.kt'
      - 'app/src/androidTest/**/MainActivity*.kt'
      - 'app/src/androidTest/**/VisionWorkflow*.kt'

jobs:
  sphere-instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Sphere instrumented tests (ARM emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          profile: pixel_6
          script: |
            cd $GITHUB_WORKSPACE
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=ab.inque.visiontechai.SphereStitchE2ETest,ab.inque.visiontechai.SphereGoldenImageTest,ab.inque.visiontechai.MainActivityModeSwitchTest,ab.inque.visiontechai.VisionWorkflowE2ETest
