name: Android unit tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-unit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run core unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --no-daemon -PciCoreTests=true
