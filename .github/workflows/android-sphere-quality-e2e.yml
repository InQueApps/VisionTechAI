name: Android Sphere Quality E2E

on:
  push:
    branches: [main]
    paths:
      - 'app/src/robotics/cpp/panorama/**'
      - 'app/src/robotics/java/**/SphereNative.kt'
      - 'app/src/main/java/**/Sphere*.kt'
      - 'app/src/main/java/**/SphereRefinePolicy.kt'
      - 'app/src/androidTest/**/Sphere*.kt'
      - '.github/workflows/android-sphere-quality-e2e.yml'
  pull_request:
    paths:
      - 'app/src/robotics/cpp/panorama/**'
      - 'app/src/robotics/java/**/SphereNative.kt'
      - 'app/src/main/java/**/Sphere*.kt'
      - 'app/src/main/java/**/SphereRefinePolicy.kt'
      - 'app/src/androidTest/**/Sphere*.kt'
      - '.github/workflows/android-sphere-quality-e2e.yml'

concurrency:
  group: android-sphere-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sphere-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Sphere quality E2E (x86_64 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            cd $GITHUB_WORKSPACE
            chmod +x gradlew
            adb shell pm trim-caches 2G || true
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ab.inque.visiontechai.RoboticsCppUnitTest,ab.inque.visiontechai.SphereRealWorldE2ETest#goldenIndoorSession_metricsAndHash
