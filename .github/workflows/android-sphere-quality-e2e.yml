name: Android Sphere Quality E2E

on:
  push:
    branches: [main]
    paths:
      - 'app/src/robotics/cpp/panorama/**'
      - 'app/src/robotics/java/**/SphereNative.kt'
      - 'app/src/main/java/**/Sphere*.kt'
      - 'app/src/main/java/**/SphereRefinePolicy.kt'
      - 'app/src/androidTest/**/Sphere*.kt'
      - '.github/workflows/android-sphere-quality-e2e.yml'
  pull_request:
    paths:
      - 'app/src/robotics/cpp/panorama/**'
      - 'app/src/robotics/java/**/SphereNative.kt'
      - 'app/src/main/java/**/Sphere*.kt'
      - 'app/src/main/java/**/SphereRefinePolicy.kt'
      - 'app/src/androidTest/**/Sphere*.kt'
      - '.github/workflows/android-sphere-quality-e2e.yml'

jobs:
  sphere-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_method:
          - ab.inque.visiontechai.SphereRealWorldE2ETest#finishWorker_texturedSession_tightGhostGate
          - ab.inque.visiontechai.SphereRealWorldE2ETest#globalFinish_parallax_broadGhostBounded
          - ab.inque.visiontechai.SphereRealWorldE2ETest#globalFinish_aeRamp_overlapStable
          - ab.inque.visiontechai.SphereRealWorldE2ETest#goldenIndoorSession_metricsAndHash
          - ab.inque.visiontechai.SphereRefineOverlapE2ETest#fastRefine_noRegression
          - ab.inque.visiontechai.SphereFinishE2ETest#finish_workerPath_producesExportEquirect
          - ab.inque.visiontechai.SphereGhostingE2ETest#globalRefine_broadGhost_withinFinishExportGate
          - ab.inque.visiontechai.SpherePerfE2ETest#refineGlobalPose_lowersOverlapBankSSD
          - ab.inque.visiontechai.RoboticsCppUnitTest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Sphere quality E2E (per-method, ${{ matrix.test_method }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            cd $GITHUB_WORKSPACE
            chmod +x gradlew
            adb shell pm trim-caches 2G || true
            ./gradlew connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=${{ matrix.test_method }}
